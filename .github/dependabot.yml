version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "automerge"
      - "dependencies"
      - "javascript"
    groups:
      # Try to group everything that uses Babel together to avoid
      # ending up with stray outdated transitive Babel dependencies
      # that need to be manually updated.
      #
      # Patterns generated based on the output of:
      #
      #     pnpm why --json '@babel/*' |
      #       jq '[.[] | recurse(.dependents[]?)
      #            | select(any(.dependents[]?; .depField == "devDependencies"))
      #            | .name] | unique'
      dev-babel-dependents:
        dependency-type: "development"
        patterns:
          - "@babel/*"
          - "jest"
          - "@types/jest"
          - "postcss-loader"
          - "stylelint*"
        update-types:
          - "minor"
          - "patch"
      # The typescript-eslint packages require each other at the same version.
      dev-typescript-eslint:
        dependency-type: "development"
        patterns:
          - "@typescript-eslint/*"
          - "typescript-eslint"

  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "automerge"
      - "dependencies"
      - "ruby"

  - package-ecosystem: "pip"
    directory: "/"
    # The default strategy has widened Poetry ranges for major updates (e.g.
    # ">=1.19.1,<3.0.0") instead of bumping the caret.
    versioning-strategy: increase
    schedule:
      interval: "daily"
    labels:
      - "automerge"
      - "dependencies"
      - "python"
