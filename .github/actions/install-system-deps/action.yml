name: Install common dependencies
description: Install common dependencies for CI workflows
inputs:
  dependencies:
    description: Which dependencies to install
    required: true
    default: |
      jq
      poetry
      geckodriver
      sentry-cli

  github-token:
    description: Token to authenticate with when requesting geckodriver and sentry-cli artifacts
    required: false

runs:
  using: composite
  steps:
    - name: Validate inputs
      id: validated
      shell: bash -e {0}
      env:
        INPUT_DEPENDENCIES: ${{ inputs.dependencies }}
      run: |
        set -euo pipefail

        if [ -z "${USER_INSTALL_DIR:-}" ]; then
          echo '::error ::USER_INSTALL_DIR environment variable is not set (caller must init ci/env.sh)'
          exit 1
        fi

        jq --null-input --raw-output '
          env.INPUT_DEPENDENCIES |
            split("\n") |
            [
              .[] |
              # Strip whitespace
              gsub("^\\s+|\\s+$"; "") |
              # Filter empty entries
              select(. != "") |
              if test("^(jq|poetry|geckodriver|sentry-cli)$") then
                .
              else
                error("::error ::Unknown dependency: \(.)")
              end
            ] |
            "dependencies=\(. | tojson)"
        ' |
        tee -a "$GITHUB_OUTPUT"

    - name: Create user install dir
      shell: bash -e {0}
      run: mkdir -p $USER_INSTALL_DIR

    - name: Install poetry
      shell: bash -e {0}
      env:
        NEEDED: ${{ contains(fromJSON(steps.validated.outputs.dependencies), 'poetry') }}
        VERSION: "2.3.2"
      run: |
        [[ "$NEEDED" == true ]] || exit 0

        echo "::group::Install poetry"
        pipx install "poetry==$VERSION"
        echo "::endgroup::"

    - name: Install jq
      shell: bash -e {0}
      env:
        NEEDED: ${{ contains(fromJSON(steps.validated.outputs.dependencies), 'jq') }}
      run: |
        [[ "$NEEDED" == true ]] || exit 0

        echo "::group::Install jq"
        bin/ci-install-jq.sh
        echo "::endgroup::"

    - name: Install geckodriver
      shell: bash -e {0}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NEEDED: ${{ contains(fromJSON(steps.validated.outputs.dependencies), 'geckodriver') }}
      run: |
        [[ "$NEEDED" == true ]] || exit 0

        if [ -z "$GH_TOKEN" ]; then
          echo '::error ::github-token input is required to install geckodriver'
          exit 1
        fi

        echo "::group::Install geckodriver"
        bin/ci-install-geckodriver.sh
        echo "::endgroup::"

    - name: Install sentry-cli
      shell: bash -e {0}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NEEDED: ${{ contains(fromJSON(steps.validated.outputs.dependencies), 'sentry-cli') }}
      run: |
        [[ "$NEEDED" == true ]] || exit 0

        if [ -z "$GH_TOKEN" ]; then
          echo '::error ::github-token input is required to install sentry-cli'
          exit 1
        fi

        echo "::group::Install sentry-cli"
        bin/ci-install-sentry-cli.sh
        echo "::endgroup::"

    - name: List dependency executable versions
      shell: bash -e {0}
      env:
        DEP_POETRY: ${{ contains(fromJSON(steps.validated.outputs.dependencies), 'poetry') }}
        DEP_GECKODRIVER: ${{ contains(fromJSON(steps.validated.outputs.dependencies), 'geckodriver') }}
        DEP_SENTRY_CLI: ${{ contains(fromJSON(steps.validated.outputs.dependencies), 'sentry-cli') }}
      run: |
        print-version() {
          local cmd=$1
          shift

          local args="$@"
          if [ -z "$args" ]; then
            args=--version
          fi

          if ! hash "$cmd" &> /dev/null; then
            echo "$cmd: not installed"
            return
          fi

          echo "$cmd ($(which "$cmd")): $("$cmd" $args 2>&1 | head -n1)"
        }

        print-version-if() {
          local condition=$1
          shift
          if [[ "$condition" == true ]]; then
            print-version "$@"
          else
            echo "$1: (not checked)"
          fi
        }

        echo 'Dependencies (externally managed):'
        print-version git
        print-version python
        print-version-if "$DEP_POETRY" pipx
        print-version-if "$DEP_GECKODRIVER" firefox

        echo
        echo 'Dependencies (via install-system-deps):'
        # Always print jq version since it's easy for it to slip into a build
        print-version jq
        print-version-if "$DEP_POETRY" poetry
        print-version-if "$DEP_GECKODRIVER" geckodriver
        print-version-if "$DEP_SENTRY_CLI" sentry-cli
